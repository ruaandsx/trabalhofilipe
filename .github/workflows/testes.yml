name: Testes e segurança
on: [push, pull_request]

# O workflow só pode ler o código (privilégio mínimo)
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [servicos/usuarios, servicos/inventario, servicos/chamados, servicos/notificacoes, gateway]
    defaults:
      run:
        working-directory: ${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pip-audit==2.10.1
      - name: Testes de ${{ matrix.servico }}
        run: pytest -q
      - name: Dependências com falhas conhecidas
        run: pip-audit -r requirements.txt

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Valida o docker-compose.yml
        run: docker compose config --quiet
